<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="制作したWebアプリとツールの一覧">
  <title>MY APPS | Webアプリ一覧</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./apps.js" defer></script>
  <script src="./script.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="header">
      <a class="brand" href="./" aria-label="MY APPS ホーム"><span class="brand-icon">▦</span> MY APPS</a>
      <span class="header-note">PERSONAL WEB TOOLS</span>
    </header>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="eyebrow"><span class="status-dot"></span> APP COLLECTION</div>
        <h1 id="page-title">小さなツールを、<br><span>ひとつの場所に。</span></h1>
        <p>制作したWebアプリや便利なツールをまとめています。</p>
      </section>
      <section class="apps-section" aria-labelledby="apps-title">
        <div class="section-head"><div><h2 id="apps-title">Applications</h2><p>公開中のアプリ一覧</p></div><span id="app-count" class="count">0 APPS</span></div>
        <div id="app-grid" class="app-grid" aria-live="polite"></div>
      </section>
    </main>
    <footer class="footer"><span>© <span id="year"></span> MY APPS</span><span>Made for the web.</span></footer>
  </div>
</body>
</html>
